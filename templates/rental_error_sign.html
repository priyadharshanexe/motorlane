<div class="od-site-sign" role="alert">
  <svg viewBox="0 0 120 106" aria-hidden="true">{% if sign == "noentry" %}<circle cx="60" cy="48" r="38" class="red"/><rect x="34" y="42" width="52" height="12" rx="2" class="white"/><rect x="57" y="86" width="6" height="18" class="post"/>{% elif sign == "diversion" %}<rect x="18" y="12" width="84" height="70" rx="6" class="yellow"/><path d="M44 70 V44 a10 10 0 0 1 10 -10 h18 v-8 l14 14 -14 14 v-8 H56 v24 z" class="ink"/><rect x="57" y="82" width="6" height="22" class="post"/>{% else %}<rect x="10" y="34" width="100" height="26" rx="3" class="board"/><path d="M14 58 l14 -22 h8 l-14 22 z" class="stripe"/><path d="M34 58 l14 -22 h8 l-14 22 z" class="stripe"/><path d="M54 58 l14 -22 h8 l-14 22 z" class="stripe"/><path d="M74 58 l14 -22 h8 l-14 22 z" class="stripe"/><path d="M94 58 l14 -22 h8 l-14 22 z" class="stripe"/><rect x="22" y="60" width="6" height="40" class="post"/><rect x="92" y="60" width="6" height="40" class="post"/>{% endif %}</svg>
  <span class="settings-kicker">{{ code }}</span>
  <h1>{{ title }}</h1>
  <p>{{ text }}</p>
  <a class="od-btn" href="{{ href|default:'/app/' }}">{{ action|default:"Back to Motorlane" }}</a>
</div>
