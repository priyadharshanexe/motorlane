name: Django tests

on:
  push:
  pull_request:

jobs:
  mysql:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-signing-key
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 33316
      MYSQL_NAME: vehicle_rental
      MYSQL_USER: vehicle_rental
      MYSQL_PASSWORD: ci-only-database-password
      # Tests run with DEBUG off, so the fake payment provider needs the explicit demo flag.
      PAYMENT_PROVIDER: fake
      DJANGO_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install -r requirements.txt
      - name: Start MySQL
        run: docker compose up --wait db
      - name: Check settings, migrations and the API schema
        run: |
          python manage.py check --fail-level WARNING
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
      - name: Run tests
        run: python manage.py test --noinput --verbosity 1
      - name: Migrations reverse cleanly
        run: |
          python manage.py migrate rental 0019 --noinput
          python manage.py migrate --noinput

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and probe a running stack
        env:
          DJANGO_SECRET_KEY: ci-only-signing-key-for-the-container-smoke-test-0123456789
          MYSQL_PASSWORD: ci-only-database-password
        run: |
          {
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "MYSQL_NAME=vehicle_rental"
            echo "MYSQL_USER=vehicle_rental"
            echo "MYSQL_PASSWORD=$MYSQL_PASSWORD"
            echo "DJANGO_DEBUG=1"
          } > .env
          docker compose --profile app build
          docker compose up --wait db
          docker compose --profile app run --rm web python manage.py migrate --noinput
          docker compose --profile app up -d --wait web scheduler
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/docs
          docker compose --profile app exec -T scheduler python manage.py run_scheduled_jobs
      - name: Production stack configuration is valid
        run: |
          cp deploy/.env.production.example deploy/.env.production
          MYSQL_PASSWORD=ci-only DOMAIN=ci.example.com docker compose -f deploy/compose.prod.yaml --env-file deploy/.env.production config -q
          docker run --rm -e DOMAIN=ci.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8 caddy validate --config /etc/caddy/Caddyfile
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile app logs


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
